name: 定时切换仓库可见性

# 北京时间 23:00 → 公开（UTC 15:00）
# 北京时间 06:00 → 私有（UTC 22:00，前一天）
# 注意：GitHub 的 cron 一律按 UTC 走，别写成北京时间。

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      visibility:
        description: '手动切换到的目标状态'
        required: true
        default: 'private'
        type: choice
        options:
          - public
          - private

permissions:
  contents: read

concurrency:
  group: toggle-visibility
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 判断目标可见性
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VIS="${{ github.event.inputs.visibility }}"
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            VIS="public"
          else
            VIS="private"
          fi
          echo "目标：$VIS"
          echo "vis=$VIS" >> "$GITHUB_OUTPUT"

      - name: 检查 Secret 是否存在
        env:
          PAT: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::缺少 REPO_PAT。去 Settings → Secrets and variables → Actions 添加，值是一个带 repo 权限的 PAT。"
            exit 1
          fi

      - name: 调用 API 切换
        env:
          PAT: ${{ secrets.REPO_PAT }}
          VIS: ${{ steps.target.outputs.vis }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$VIS" = "public" ]; then
            FLAG=false
          else
            FLAG=true
          fi
          PAYLOAD=$(printf '{"private":%s}' "$FLAG")

          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" \
            -d "$PAYLOAD")

          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::切换失败，GitHub 返回："
            cat /tmp/resp.json
            exit 1
          fi

          python3 -c "import json;d=json.load(open('/tmp/resp.json'));print('仓库:',d.get('full_name'));print('当前可见性:',d.get('visibility'));print('private:',d.get('private'))"
