name: 仓库可见性自愈

# 每小时第 5 分钟醒一次：算出「现在北京时间该是公开还是私有」，
# 和当前状态对不上才动手。已经是目标状态就直接退出，不浪费调用。
#
# 公开窗口：北京时间 23:00 ~ 05:59
#
# 为什么不用「定点切换」：GitHub 的 schedule 不保证执行。
# 官方文档说整点属高负载时段，排队中的任务可能被直接丢弃。
# 2026-10-20 实测：设在 0 15 / 0 22 的两次调度一次都没跑，且不报错。
# 声明式自愈的好处是丢一次不影响，下一次自动纠正。
#
# ⚠️ 2026-10-23 实测：GitHub 对 schedule 有节流，实际间隔 3~5 小时且时间漂移
# （记录：04:33 / 01:04 / 19:43 / 14:02 / 08:37 / 05:35 / 01:05）。
# 也就是说「每小时一次」只是名义上的，可能几小时才真正跑一次。
# 所以额外挂上 push 触发：每次推代码顺带纠一次状态，白天活跃时能及时收口。

on:
  schedule:
    - cron: '5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visibility:
        description: '手动切换到的目标状态'
        required: true
        default: 'private'
        type: choice
        options:
          - public
          - private

permissions:
  contents: read

concurrency:
  group: toggle-visibility
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 算出目标状态
        id: want
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ github.event.inputs.visibility }}"
            echo "手动触发 → 目标：$WANT"
          else
            H=$(TZ='Asia/Shanghai' date +%H)
            H=$((10#$H))
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              WANT=public
            else
              WANT=private
            fi
            echo "北京时间 ${H} 点 → 目标：$WANT"
          fi
          echo "want=$WANT" >> "$GITHUB_OUTPUT"

      - name: 读当前状态
        id: cur
        env:
          PAT: ${{ secrets.REPO_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::缺少 REPO_PAT，去 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          BODY=$(curl -sf --retry 3 \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO")
          CUR=$(printf '%s' "$BODY" | python3 -c "import json,sys;print('private' if json.load(sys.stdin).get('private') else 'public')")
          echo "当前：$CUR"
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"

      - name: 需要时切换
        env:
          PAT: ${{ secrets.REPO_PAT }}
          REPO: ${{ github.repository }}
          WANT: ${{ steps.want.outputs.want }}
          CUR: ${{ steps.cur.outputs.cur }}
        run: |
          if [ "$CUR" = "$WANT" ]; then
            echo "已经是 $WANT，跳过"
            exit 0
          fi

          if [ "$WANT" = "public" ]; then
            FLAG=false
          else
            FLAG=true
          fi
          PAYLOAD=$(printf '{"private":%s}' "$FLAG")

          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" \
            -d "$PAYLOAD")

          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::切换失败，GitHub 返回："
            cat /tmp/resp.json
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/resp.json'));print('已切换为',d.get('visibility'))"
