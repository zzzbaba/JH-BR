# 江汉BR —— OrbStack / Docker Desktop 通用
# 一条命令：docker compose up -d --build   （或者直接 ./deploy.sh）
services:
  jianghan-br:
    build:
      context: .
      dockerfile: Dockerfile
    image: jianghan-br:latest
    container_name: jianghan-br
    restart: unless-stopped

    # 端口不变：宿主机 8123 → 容器 8123
    ports:
      - "8123:8123"

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: "8123"
      # 容器内必须听 0.0.0.0，否则 -p 映射进不来
      HOST: "0.0.0.0"

    volumes:
      # 存档 / 账号 / 世界状态全在这里，务必挂出来
      # 想把 Windows 上的老数据带过去，直接覆盖这个目录即可
      - ./store:/app/store

    # init 负责转发信号 + 回收僵尸进程，让 SIGTERM 能真正到达 node
    init: true
    stop_grace_period: 20s

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 851 份存档常驻内存约 10MB 堆，给个上限防跑飞
    mem_limit: 512m

    # 常年无人值守：日志必须限大小，否则 json 日志能把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
