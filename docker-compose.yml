# 江汉BR —— OrbStack / Docker Desktop 通用
# 一条命令：docker compose up -d --build   （或者直接 ./deploy.sh）
services:
  jianghan-br:
    build:
      context: .
      dockerfile: Dockerfile
    image: jianghan-br:latest
    container_name: jianghan-br
    restart: unless-stopped

    # 端口不变：宿主机 8123 → 容器 8123
    ports:
      - "8123:8123"

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: "8123"
      # 容器内必须听 0.0.0.0，否则 -p 映射进不来
      HOST: "0.0.0.0"

    volumes:
      # ⚠️ 必须用 docker 卷，不能用 ./store 这种 bind mount。
      # 原因：storage-queue.js 落盘时会 fsync（handle.sync()），
      # fsync 在 virtiofs（macOS 的 bind mount）上会挂死 —— 进程卡进 D 状态，
      # 连 SIGKILL 都杀不掉，容器「Up 但没响应」，还拖垮整个 Docker 引擎（实测 420% CPU）。
      # 卷在 VM 内的 ext4 上，fsync 正常。实测同样配置跑 11 小时无异常。
      - brstore:/app/store

    # init 负责转发信号 + 回收僵尸进程，让 SIGTERM 能真正到达 node
    init: true
    stop_grace_period: 20s

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 851 份存档常驻内存约 10MB 堆，给个上限防跑飞
    mem_limit: 512m

    # 常年无人值守：日志必须限大小，否则 json 日志能把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # 固定名字，方便备份/迁移时直接引用；不存在会自动创建
  brstore:
    name: jianghan-br-store
